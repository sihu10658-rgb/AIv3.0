name: Build Ollama

on:
  push:
    branches: [ main ]
  workflow_dispatch: # GitHub 웹사이트에서 수동으로도 실행 가능

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 소스코드 체크아웃
        uses: actions/checkout@v4

      - name: Go 환경 설정
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: 필수 빌드 도구 설치 (CMake 등)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      - name: C++ 백엔드 및 Go 코드 생성
        run: |
          go generate ./...

      - name: Ollama 실행 파일 빌드
        run: |
          go build -o ollama .

      - name: 빌드 결과물(Artifact) 업로드
        uses: actions/upload-artifact@v4
        with:
          name: ollama-linux-binary
          path: ollama
